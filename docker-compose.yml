services:
  db:
    image: postgis/postgis:16-3.4
    container_name: metziah_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5432:5432"
    volumes:
      - metziah_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: metziah_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      PGHOST: db
      PGDATABASE: metziah_test
    volumes:
      - ./data:/app/data
    command: ["sleep", "infinity"]

volumes:
  metziah_pgdata: