services:
  db:
    image: postgis/postgis:16-3.4
    container_name: metziah_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5432:5432"
    volumes:
      - metziah_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: metziah:latest
    container_name: metziah_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      PGHOST: db
      PGDATABASE: metziah_prod
    volumes:
      - ./data:/app/data
    command: ["sleep", "infinity"]

  api:
    image: metziah:latest
    container_name: metziah_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      PGHOST: db
      PGDATABASE: ${PGDATABASE}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  metziah_pgdata: